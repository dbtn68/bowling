<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>점수 합산 시스템</title>

<style>
:root {
    --main: #2563eb;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    margin-bottom: 25px;
}

button {
    background: var(--main);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    border: 1px solid var(--border);
    padding: 8px;
    text-align: center;
}

thead {
    background: #f1f5f9;
}

/* 🔥 핵심 수정 부분 */
input[type="text"],
input[type="number"] {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    font-size: 14px;
    color: #111827;
    background-color: #ffffff;
}

input:focus {
    outline: none;
    border-color: var(--main);
    box-shadow: 0 0 0 2px rgba(37,99,235,0.15);
}

.rank-item {
    padding: 10px;
    background: #f9fafb;
    border-left: 4px solid var(--main);
    margin-bottom: 6px;
    border-radius: 6px;
}
</style>
</head>

<body>

<div class="card">
    <h2>플레이어 점수 입력</h2>

    <button onclick="addPlayer()">이름 입력칸 추가</button>
    <button onclick="calculateScores()">점수 합산</button>

    <table id="scoreTable">
        <thead>
            <tr>
                <th>이름</th>
                <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th>
                <th>6</th><th>7</th><th>8</th><th>9</th><th>10</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h2>결과</h2>
    <div id="result">아직 결과가 없습니다.</div>
</div>

<script>
const defaultNames = [
    "신유수", "권민준", "백윤호",
    "김용한", "방지원", "김건우", "신홍익"
];

const tbody = document.querySelector("#scoreTable tbody");

defaultNames.forEach(name => addPlayer(name));

function addPlayer(name = "") {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = name;
    nameTd.appendChild(nameInput);
    tr.appendChild(nameTd);

    for (let i = 0; i < 10; i++) {
        const td = document.createElement("td");
        const input = document.createElement("input");
        input.type = "number";
        td.appendChild(input);
        tr.appendChild(td);
    }

    tbody.appendChild(tr);
}

function calculateScores() {
    const rows = tbody.querySelectorAll("tr");
    const results = [];

    rows.forEach(row => {
        const inputs = row.querySelectorAll("input");
        const name = inputs[0].value.trim();
        if (!name) return;

        let sum = 0;
        for (let i = 1; i <= 10; i++) {
            sum += Number(inputs[i].value) || 0;
        }

        results.push({ name, sum });
    });

    results.sort((a, b) => b.sum - a.sum);

    const result = document.getElementById("result");
    result.innerHTML = "";

    if (results.length === 0) {
        result.textContent = "결과가 없습니다.";
        return;
    }

    results.forEach((p, i) => {
        const div = document.createElement("div");
        div.className = "rank-item";
        div.textContent = `${i + 1}등 - ${p.name} : ${p.sum}점`;
        result.appendChild(div);
    });
}
</script>

</body>
</html>
